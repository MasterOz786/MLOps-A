name: CI/CD Pipeline

on:
  push:
    branches: [dev, test, master]
  pull_request:
    branches: [test, master]

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort
    
    - name: Code formatting check
      run: |
        echo "🎨 Checking code formatting..."
        black --check --diff .
    
    - name: Import sorting check
      run: |
        echo "📦 Checking import sorting..."
        isort --check-only --diff .
    
    - name: Lint check
      run: |
        echo "🔍 Running linting..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Job 2: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        echo "🧪 Running unit tests on Python ${{ matrix.python-version }}..."
        python -m pytest test_app.py -v --tb=short --junitxml=test-results-${{ matrix.python-version }}.xml --cov=app --cov-report=xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.13'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Job 3: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start Flask app
      run: |
        echo "🚀 Starting Flask application..."
        python app.py &
        sleep 10
        echo "✅ Flask app started"
    
    - name: Test Flask endpoints
      run: |
        echo "🔗 Testing Flask endpoints..."
        # Test home page
        curl -f http://localhost:5000/ || exit 1
        echo "✅ Home page accessible"
        
        # Test prediction endpoint
        curl -X POST http://localhost:5000/predict \
          -d "Online Order=1&Book Table=0&Votes=100&Location=1&Restaurant Type=1&Cuisines=1&Cost=500&Menu Item=1" \
          -f || exit 1
        echo "✅ Prediction endpoint working"

  # Job 4: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run security scan
      run: |
        echo "🔒 Running security scan..."
        bandit -r . -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true
        echo "✅ Security scan completed"

  # Job 5: Build and Package
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create deployment package
      run: |
        echo "📦 Creating deployment package..."
        mkdir -p deployment
        cp -r app.py model.py model.pkl templates static requirements.txt deployment/
        tar -czf zomato-app-$(date +%Y%m%d-%H%M%S).tar.gz deployment/
        echo "✅ Deployment package created"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: "*.tar.gz"

  # Job 6: Deploy to Test Environment (if on test branch)
  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: deployment-package
    
    - name: Deploy to test environment
      run: |
        echo "🚀 Deploying to test environment..."
        echo "✅ Test deployment completed (simulated)"
        echo "🔗 Test environment would be available at: https://test.zomato-app.example.com"

  # Job 7: Notify on completion
  notify:
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, security-scan, build]
    if: always()
    
    steps:
    - name: Notify pipeline completion
      run: |
        echo "🎉 CI/CD Pipeline completed!"
        echo "📊 Results:"
        echo "  - Code Quality: ${{ needs.code-quality.result }}"
        echo "  - Unit Tests: ${{ needs.unit-tests.result }}"
        echo "  - Integration Tests: ${{ needs.integration-tests.result }}"
        echo "  - Security Scan: ${{ needs.security-scan.result }}"
        echo "  - Build: ${{ needs.build.result }}"
        
        if [[ "${{ needs.unit-tests.result }}" == "success" && "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "✅ All tests passed! Ready for deployment."
        else
          echo "❌ Some tests failed. Please check the logs."
        fi
