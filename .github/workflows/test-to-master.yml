name: Test to Master PR

on:
  push:
    branches:
      - test

jobs:
  create-pr-to-master:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Create PR from test to master
      run: |
        echo "Creating PR from test to master..."
        
        # Get commit info
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        
        # Check if PR already exists
        EXISTING_PR=$(gh pr list --base master --head test --state open --json number --jq '.[0].number' || echo "")
        
        if [ -n "$EXISTING_PR" ]; then
          echo "PR already exists: #$EXISTING_PR"
          echo "Updating existing PR..."
          gh pr comment $EXISTING_PR --body "🔄 **Updated** - New commit: \`$COMMIT_SHORT\` - $COMMIT_MSG"
        else
          echo "Creating new PR..."
          gh pr create \
            --base master \
            --head test \
            --title "🚀 Release: $COMMIT_MSG" \
            --body "## 🚀 Release PR from Test to Master
        
        **Changes:**
        - Commit: \`$COMMIT_SHORT\`
        - Message: $COMMIT_MSG
        
        **Status:**
        ✅ All tests passed on test branch
        ✅ Ready for production deployment
        
        **Next Steps:**
        1. 🔍 Final review before production
        2. ✅ Merge to master for deployment
        3. 🚀 Deploy to production environment
        
        ---
        *Created automatically after successful testing*" || {
            echo "Failed to create PR, but continuing..."
            exit 0
          }
        fi
        
        echo "✅ PR to master handled successfully!"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
