name: Docker Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOCKER_IMAGE: zomato-flask-app
  DOCKER_TAG: latest

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Image digest
      run: echo ${{ steps.build.outputs.digest }}

  notify-jenkins:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Notify Jenkins
      run: |
        echo "Notifying Jenkins about successful Docker build..."
        
        # Jenkins webhook URL (replace with your actual Jenkins URL)
        JENKINS_URL="${{ secrets.JENKINS_URL }}/job/zomato-deploy/buildWithParameters"
        
        # Trigger Jenkins job with parameters
        curl -X POST "$JENKINS_URL" \
          --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
          --data "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}" \
          --data "DOCKER_TAG=${{ env.DOCKER_TAG }}" \
          --data "GITHUB_SHA=${{ github.sha }}" \
          --data "GITHUB_REF=${{ github.ref }}" \
          --data "BUILD_CAUSE=GitHub%20Actions" || {
          echo "Jenkins notification failed, but continuing..."
        }
        
        echo "Jenkins notification sent successfully!"

