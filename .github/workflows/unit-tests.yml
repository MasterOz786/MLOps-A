name: Unit Tests

on:
  pull_request:
    branches:
      - test
    types: [opened, synchronize, reopened]
  push:
    branches:
      - test

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        echo "🧪 Running unit tests..."
        python -m pytest test_app.py -v --tb=short --junitxml=test-results.xml
    
    - name: Generate test report
      run: |
        echo "📊 Test Results Summary:"
        python -m pytest test_app.py --tb=no -q
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results.xml
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          try {
            // Run tests and capture output
            const testOutput = execSync('python -m pytest test_app.py --tb=no -q', { encoding: 'utf8' });
            
            // Parse test results
            const lines = testOutput.split('\n');
            const summaryLine = lines.find(line => line.includes('passed') || line.includes('failed'));
            
            let status = '✅';
            let message = 'All tests passed!';
            
            if (summaryLine) {
              if (summaryLine.includes('failed')) {
                status = '❌';
                message = 'Some tests failed';
              }
            }
            
            const comment = `## 🧪 Unit Test Results ${status}
            
            ${message}
            
            ### 📋 Test Summary:
            \`\`\`
            ${testOutput}
            \`\`\`
            
            ### 🔍 Details:
            - **Branch**: \`${context.payload.pull_request.head.ref}\` → \`${context.payload.pull_request.base.ref}\`
            - **Commit**: \`${context.payload.pull_request.head.sha.substring(0, 7)}\`
            - **Triggered by**: ${context.payload.pull_request.user.login}
            
            ---
            *Tests run automatically on PR creation/update*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
          } catch (error) {
            const comment = `## 🧪 Unit Test Results ❌
            
            Tests failed to run properly.
            
            ### Error:
            \`\`\`
            ${error.message}
            \`\`\`
            
            Please check the workflow logs for more details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
    
    - name: Set PR status
      if: github.event_name == 'pull_request'
      run: |
        # This step will pass if all previous steps pass
        echo "✅ All unit tests completed successfully"
        echo "🔗 PR: ${{ github.event.pull_request.html_url }}"
