name: Dev to Test PR

on:
  push:
    branches:
      - dev

jobs:
  create-pr:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Create PR from dev to test
      run: |
        echo "Creating PR from dev to test..."
        
        # Get commit info
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        
        # Create PR
        gh pr create \
          --base test \
          --head dev \
          --title "🚀 Feature: $COMMIT_MSG" \
          --body "## 🔄 Auto PR from Dev to Test
        
        **Changes:**
        - Commit: \`$COMMIT_SHORT\`
        - Message: $COMMIT_MSG
        
        **Next Steps:**
        1. ✅ Tests will run automatically on test branch
        2. 🔍 Review changes
        3. ✅ Merge after tests pass
        
        ---
        *Created automatically*" \
          --label "auto-pr,dev-to-test"
        
        echo "✅ PR created successfully!"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
