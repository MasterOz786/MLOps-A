apiVersion: v1
kind: Secret
metadata:
  name: zomato-app-secrets
  labels:
    app: zomato-flask-app
type: Opaque
data:
  # Base64 encoded values (replace with your actual values)
  # To encode: echo -n "your-value" | base64
  flask-secret-key: Zmxhc2stc2VjcmV0LWtleS1jaGFuZ2UtbWU=  # flask-secret-key-change-me
  database-url: cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BkYjoxNDMyL3pvbWF0bw==  # postgresql://user:pass@db:1432/zomato
stringData:
  # Non-sensitive configuration (will be base64 encoded automatically)
  environment: "production"
  log-level: "INFO"
