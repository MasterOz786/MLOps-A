apiVersion: v1
kind: Namespace
metadata:
  name: zomato-app
  labels:
    name: zomato-app
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zomato-app-quota
  namespace: zomato-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "5"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: zomato-app-limits
  namespace: zomato-app
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    type: Container
